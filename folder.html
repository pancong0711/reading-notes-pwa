<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>文件夹 · 读书笔记</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=20261107a">
  <script src="reading-font.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">读书笔记</a>
      <nav class="nav" id="main-nav"></nav>
    </div>
  </header>

  <main class="container">
    <div class="folder-page-top">
      <button class="btn ghost small" id="back-btn" type="button">← 返回笔记目录</button>
    </div>
    <section class="welcome">
      <h1 id="folder-title">文件夹</h1>
      <p class="breadcrumb" id="breadcrumb"></p>
    </section>

    <!-- 文件夹主操作：新建笔记/子文件夹始终可达（不依赖是否有笔记），与多选批量操作分离 -->
    <div class="folder-command-bar" id="folder-command-bar">
      <button class="btn primary" id="new-note-btn" type="button">＋ 在此文件夹写笔记</button>
      <button class="btn ghost" id="new-subfolder-btn" type="button">＋ 子文件夹</button>
      <button class="btn ghost" id="select-toggle" type="button">☑ 多选</button>
    </div>

    <!-- 多选批量操作栏：仅多选模式显示 -->
    <div class="bulk-bar" id="bulk-bar" hidden>
      <span class="muted" id="bulk-count"></span>
      <button class="btn ghost small" id="select-all" type="button" hidden>全选</button>
      <button class="btn primary small" id="move-btn" type="button" hidden>移动到文件夹</button>
      <button class="btn ghost small danger" id="delete-btn" type="button" hidden>🗑 删除</button>
    </div>

    <!-- 筛选栏（类型 chips + 搜索 + 日期） -->
    <details class="filter-collapse" id="filter-collapse">
      <summary>筛选与搜索</summary>
      <div class="filter-bar" id="filter-bar">
        <div class="filter-type-chips" id="type-chips"></div>
        <input type="search" id="search-input" placeholder="搜索标题/内容/读者注/AI注…">
        <input type="date" id="filter-from" title="起始日期">
        <span class="muted">～</span>
        <input type="date" id="filter-to" title="结束日期">
        <button type="button" class="btn ghost small" data-quick="month">本月</button>
        <button type="button" class="btn ghost small" data-quick="year">今年</button>
        <button type="button" class="btn ghost small" data-quick="clear">清空</button>
      </div>
    </details>

    <!-- 子文件夹 -->
    <div id="sub-folders" class="folder-grid"></div>

    <!-- 直属笔记 -->
    <div id="note-list" class="note-list"></div>

    <div class="empty-state" id="empty-state" hidden>
      <h2>这个文件夹还没有笔记</h2>
      <p>可以在当前文件夹直接新建第一篇；已有笔记也可通过「移动到文件夹」归入。</p>
      <button class="btn primary" id="empty-new-btn" type="button">＋ 在此文件夹写笔记</button>
    </div>

    <!-- 单篇卡片操作面板（手机端替代一排小按钮） -->
    <div id="card-action-panel" class="type-manage" hidden>
      <h2 id="card-action-title">笔记操作</h2>
      <p class="muted" id="card-action-meta"></p>
      <div class="card-action-list">
        <button class="btn ghost" id="card-act-pin" type="button">☆ 置顶</button>
        <button class="btn ghost" id="card-act-edit" type="button">✏️ 编辑</button>
        <button class="btn ghost" id="card-act-move" type="button">📁 移动到文件夹</button>
        <button class="btn ghost danger" id="card-act-delete" type="button">🗑 删除</button>
        <button class="btn primary" id="card-action-cancel" type="button">取消</button>
      </div>
    </div>

    <!-- 新建子文件夹面板 -->
    <div id="subfolder-panel" class="type-manage" hidden>
      <h2>新建子文件夹</h2>
      <p class="muted">支持层级路径，用 <code>/</code> 分隔；全角斜杠会自动转换。</p>
      <label class="field">路径
        <input id="subfolder-path" type="text" placeholder="如：项目A/文献" autocomplete="off">
      </label>
      <p class="muted" id="subfolder-msg"></p>
      <div class="editor-actions">
        <button class="btn primary" id="subfolder-save" type="button">创建</button>
        <button class="btn ghost" id="subfolder-cancel" type="button">取消</button>
      </div>
    </div>

    <!-- 移动面板 -->
    <div id="move-panel" class="type-manage" hidden>
      <h2>移动到文件夹</h2>
      <p class="muted" id="move-info"></p>
      <label class="field">选择已有文件夹
        <select id="move-select"></select>
      </label>
      <label class="field">或新建文件夹（留空则用上方选择）
        <input id="move-new" type="text" placeholder="如：项目A/文献" autocomplete="off">
      </label>
      <div class="editor-actions">
        <button class="btn primary" id="move-confirm" type="button">确定移动</button>
        <button class="btn ghost" id="move-cancel" type="button">取消</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">读书笔记 · 本地浏览</div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="file-warning.js"></script>
  <script src="sw-register.js"></script>
  <script src="panel-modal.js"></script>
  <script src="types.js"></script>
  <script>
    document.getElementById('main-nav').innerHTML = NoteTypes.renderNav('folders');
  </script>
  <script type="module" src="folder.js?v=20261107a"></script>
</body>
</html>
