<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>记录 · 读书笔记</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=20261107a">
  <script src="reading-font.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">读书笔记</a>
      <nav class="nav" id="main-nav"></nav>
    </div>
  </header>

  <main class="container">
    <section class="welcome">
      <h1 id="type-title">记录</h1>
      <p id="type-hint"></p>
    </section>

    <!-- 列表筛选栏（项目/书名/日期区间 + 快捷；与搜索 AND 叠加） -->
    <div class="filter-bar" id="filter-bar">
      <select id="filter-project"><option value="">全部文件夹</option></select>
      <select id="filter-book"><option value="">全部书名</option></select>
      <input type="date" id="filter-from" title="起始日期">
      <span class="muted">～</span>
      <input type="date" id="filter-to" title="结束日期">
      <button type="button" class="btn ghost small" data-quick="month">本月</button>
      <button type="button" class="btn ghost small" data-quick="year">今年</button>
      <button type="button" class="btn ghost small" data-quick="clear">清空</button>
    </div>

    <div class="toolbar">
      <input id="search-input" type="search" placeholder="搜索标题/内容/读者注/AI注…">
      <span class="count" id="record-count"></span>
      <div class="toolbar-actions">
        <button class="btn primary" id="new-btn" type="button">＋ 写一篇</button>
        <button class="btn ghost" id="data-btn" type="button" title="导入 / 备份 / 导出 / 类型 / 标签">⚙️ 数据</button>
      </div>
    </div>

    <p class="import-status" id="import-status" hidden></p>
    <div id="record-list"></div>

    <div class="empty-state" id="empty-state" hidden>
      <h2 id="empty-title">还没有记录</h2>
      <p id="empty-hint">点「写一篇」随手记录。</p>
      <button class="btn" id="empty-new-btn" type="button">写一篇</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">读书笔记 · 本地浏览</div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="file-warning.js"></script>
  <script src="sw-register.js"></script>
  <script src="panel-modal.js"></script>
  <script src="types.js"></script>
  <script>
    document.getElementById('main-nav').innerHTML = NoteTypes.renderNav('folders');
  </script>
  <script type="module" src="type.js?v=20261107a"></script>
</body>
</html>
