<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记详情 · 读书笔记</title>
  <link rel="stylesheet" href="styles.css?v=20260905d">
  <script src="reading-font.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">读书笔记</a>
      <nav class="nav" id="main-nav"></nav>
    </div>
  </header>

  <main class="container">
    <div class="note-page">
      <!-- 顶栏：返回 + 编辑 -->
      <div class="note-page-top">
        <button class="btn ghost small" id="back-btn" type="button">← 返回</button>
        <button class="btn primary small" id="edit-btn" type="button">✏️ 编辑</button>
      </div>

      <!-- 题头：类型徽标 + 标题 + 元信息 + 字号档位 -->
      <div class="note-page-head">
        <span class="graph-panel-kind" id="note-type-badge" hidden></span>
        <h1 id="note-title">加载中…</h1>
        <p class="note-page-meta" id="note-meta"></p>
        <div class="fs-switch">
          <button class="btn ghost small" id="fs-btn" type="button" aria-haspopup="true" aria-expanded="false" title="阅读字号">Aa</button>
          <div class="fs-pop" id="fs-pop" role="menu" hidden>
            <button type="button" role="menuitem" data-fs-pick="small">小 <span class="fs-demo" style="font-size:13px">字</span></button>
            <button type="button" role="menuitem" data-fs-pick="">⭕ 标准 <span class="fs-demo" style="font-size:15px">字</span></button>
            <button type="button" role="menuitem" data-fs-pick="large">大 <span class="fs-demo" style="font-size:17px">字</span></button>
            <button type="button" role="menuitem" data-fs-pick="xlarge">特大 <span class="fs-demo" style="font-size:19px">字</span></button>
            <p class="muted fs-hint">仅本机生效（存本地），详情/图谱面板同源</p>
          </div>
        </div>
        <div class="fs-switch">
          <button class="btn ghost small" id="view-btn" type="button" aria-haspopup="true" aria-expanded="false" title="显示视图">◫ 视图</button>
          <div class="fs-pop" id="view-pop" role="menu" hidden>
            <button type="button" role="menuitem" data-layout-pick="scroll">↕ 连续 <span class="muted">（滚动）</span></button>
            <button type="button" role="menuitem" data-layout-pick="spread">📖 书页 <span class="muted">（双页翻页）</span></button>
            <p class="muted fs-hint">书页模式：双页并排+翻页（宽屏双列/窄屏单页）；存本机</p>
          </div>
        </div>
      </div>

      <!-- 详情（note-detail 共享组件 + 公式排版）；书页模式下外层为视口、内层为多列内容 -->
      <div class="note-page-body" id="note-card">
        <div class="spread-viewport" id="spread-viewport">
          <div class="note-md" id="note-body"></div>
        </div>
      </div>

      <!-- 书页模式翻页条（仅书页模式显示） -->
      <div class="spread-nav" id="spread-nav" hidden>
        <button class="btn ghost small" id="spread-prev" type="button" aria-label="上一页">‹ 上一页</button>
        <span class="spread-indicator" id="spread-indicator">第 1/1 屏</span>
        <button class="btn ghost small" id="spread-next" type="button" aria-label="下一页">下一页 ›</button>
      </div>

      <p class="muted" id="note-missing" hidden></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">读书笔记 · 本地浏览</div>
  </footer>

  <!-- 返回顶部 FAB（需求 20260905-②：长文下拉后快速回顶） -->
  <button class="back-top-fab" id="back-top-btn" type="button" aria-label="返回顶部" title="返回顶部">↑</button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="file-warning.js"></script>
  <script src="sw-register.js"></script>
  <script src="types.js"></script>
  <script type="module" src="note.js?v=20260905d"></script>
</body>
</html>
